[package]
name = "chassis-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "chassis_daemon"

[[bin]]
name = "chassis-daemon"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6.0"
hex = "0.4"
rand = "0.10"
sha2 = "0.11"
subtle = "2.6"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3"
