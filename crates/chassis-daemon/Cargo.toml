[package]
name = "chassis-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "chassis_daemon"

[[bin]]
name = "chassis-daemon"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
chassis-telemetry-protocol = { path = "../chassis-telemetry-protocol" }
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6.0"
hex = "0.4"
rand = "0.10"
sha2 = "0.11"
subtle = "2.6"
sysinfo = { version = "0.40.4", default-features = false, features = ["disk", "gpu", "network", "system"] }
tokio = { version = "1.54", features = ["sync"] }
tracing = "0.1.44"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
macmon = { version = "0.12", default-features = false }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1.54", features = ["macros", "rt", "sync", "time"] }
