[package]
name = "chassis-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "chassis_daemon"

[[bin]]
name = "chassis-daemon"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23"
chassis-telemetry-protocol = { path = "../chassis-telemetry-protocol" }
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6.0"
futures-util = "0.3"
hex = "0.4"
hmac = "0.13"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "service"] }
rand = "0.10"
serde = "1"
serde_json = "1"
sha2 = "0.11"
sysinfo = { version = "0.40.4", default-features = false, features = ["disk", "gpu", "network", "system"] }
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
macmon = { version = "0.12", default-features = false }

[dev-dependencies]
tempfile = "3"
